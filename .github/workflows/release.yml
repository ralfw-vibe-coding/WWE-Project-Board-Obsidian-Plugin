name: Release

# main.js liegt bewusst nicht im Repo. Damit BRAT und die manuelle Installation
# etwas zum Herunterladen haben, baut dieser Workflow bei jedem Tag und hängt
# die drei Dateien an ein GitHub-Release.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # BRAT liest die Version aus der manifest.json im Repo und sucht dann das
      # Release mit genau diesem Tag. Laufen die auseinander, findet es nichts.
      - name: Tag gegen manifest.json prüfen
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag '$GITHUB_REF_NAME' passt nicht zur Version '$MANIFEST_VERSION' in manifest.json."
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Release anlegen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
